name: Do Not Submit

on:
  pull_request:
    branches: [ 'main', 'release-*' ]

permissions: read-all

jobs:

  donotsubmit:
    name: Do Not Submit
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Do Not Submit
        uses: chainguard-dev/actions/donotsubmit@fabe4ed3f66ceb5f8ec86ed7ae6d0c945ca362fb # v1.6.28
