        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: chainguard-dev/actions/trailing-space@142d22e4cec7c824db396585b9bc86f76f7c1732 # v1.6.35
        if: ${{ always() }}

      - uses: chainguard-dev/actions/eof-newline@142d22e4cec7c824db396585b9bc86f76f7c1732 # v1.6.35
        if: ${{ always() }}
